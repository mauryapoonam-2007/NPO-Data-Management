
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Inventory | NPO Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <a class="brand" href="dashboard.html">
            <img src="logo.png" alt="NPO Logo" class="brand-logo">
            NPO Management</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="inventory.html">Add Inventory</a>
            <a href="inventory-records.html">Inventory Records</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <main class="form-card">
        <header class="page-heading">
            <h1>Add Inventory</h1>
            <p>Add donated items and supplies for the NPO.</p>
        </header>

        <form id="inventoryForm">
            <div class="form-grid">

                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input id="itemName" name="itemName"
                           type="text" placeholder="Enter item name" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="EDUCATION">Education</option>
                        <option value="FOOD">Food</option>
                        <option value="CLOTHING">Clothing</option>
                        <option value="MEDICAL">Medical</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input id="quantity" name="quantity"
                           type="number" min="1"
                           placeholder="Enter quantity" required>
                </div>

                <div class="form-group">
                    <label for="unit">Unit</label>
                    <select id="unit" name="unit" required>
                        <option value="">Select Unit</option>
                        <option value="pcs">Pieces (pcs)</option>
                        <option value="kg">Kilograms (kg)</option>
                        <option value="litres">Litres</option>
                        <option value="packets">Packets</option>
                        <option value="boxes">Boxes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input id="city" name="city"
                           type="text" placeholder="Enter city" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input id="description" name="description"
                           type="text" placeholder="Enter description">
                </div>

            </div>

            <button class="primary-button" type="submit">
                Add Inventory
            </button>

            <p id="message" class="message" role="status"></p>
        </form>

        <a class="records-link" href="inventory-records.html">
            View All Inventory Records
        </a>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
